name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  pester:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Pester tests
        shell: powershell
        run: |
          # Use pre-installed Pester (3.x on Windows PowerShell 5.1)
          $module = Get-Module -ListAvailable -Name Pester | Sort-Object Version -Descending | Select-Object -First 1
          Write-Output "Using Pester $($module.Version)"
          Import-Module Pester -RequiredVersion $module.Version -Force
          # Skip integration tests (no config.json on CI runner)
          Invoke-Pester -Path tests/relay.tests.ps1 -TestName "Redact-Secrets","Test-PathInsideRoot","Compare-GitStatusSnapshots"

      - name: Verify scripts are syntactically valid
        shell: powershell
        run: |
          $errors = @()
          Get-ChildItem -Recurse -Filter *.ps1 -Path tools | ForEach-Object {
              # Read as UTF-8 to handle BOM
              $code = Get-Content $_.FullName -Raw -Encoding UTF8
              try {
                  $null = [ScriptBlock]::Create($code)
                  Write-Output "OK: $($_.Name)"
              } catch {
                  $errors += "$($_.Name): $_"
              }
          }
          if ($errors.Count -gt 0) {
              Write-Error "Syntax errors found:`n$($errors -join "`n")"
              exit 1
          }
          Write-Output "All $((Get-ChildItem -Recurse -Filter *.ps1 -Path tools).Count) scripts pass syntax check."
